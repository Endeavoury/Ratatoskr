assumptions:
  - The component is a standard unicast DNS stub/client with an explicitly selected or OS-configured upstream resolver.
  - The operating-system network stack owns socket mechanics; this model defines component-visible events and effects only.
  - The authorized transport policy is UDP first and TCP fallback only after a correlated UDP response has TC set.
open_questions:
  - Numerical resource budgets and their configurability are API/product policy, constrained only by the stated protocol maxima and invariants.
  - Retry, server selection, timeout/cancellation ownership, TCP-first, reuse, and pipelining are not selected capabilities.
  - The selected ordinary QTYPE capability set is API/product policy; ANY, meta, and unassigned/reserved requests are unsupported in this profile.
limitations:
  - G3 is NOT_STARTED. This candidate is not an API, ABI, parser algorithm, implementation, vector set, or approval.
  - EDNS, OPT option semantics, extended RCODE representation, DNSSEC validation, encrypted DNS, recursive/authoritative behavior, caching, transfers, UPDATE, NOTIFY, DSO, mDNS/DNS-SD, and bindings are excluded.
semantic_domains:
  - id: DOM-DNS-U16
    meaning: Unsigned DNS wire-sized scalar.
    constraints: integer range 0..65535; semantic numeric value independent of representation.
    requirement_refs: [DNS-REQ-003, DNS-REQ-004, DNS-REQ-006, DNS-REQ-010, DNS-REQ-019]
  - id: DOM-DNS-U32
    meaning: Unsigned DNS TTL scalar.
    constraints: integer range 0..4294967295.
    requirement_refs: [DNS-REQ-010]
  - id: DOM-DNS-NAME
    meaning: DNS domain name as ordered label octets plus root termination.
    constraints: each label is 1..63 octets; complete expanded wire name is at most 255 octets; root is zero labels; ASCII A-Z/a-z compare case-insensitively only.
    requirement_refs: [DNS-REQ-002, DNS-REQ-008, DNS-REQ-009, DNS-REQ-012]
  - id: DOM-DNS-OPAQUE-BYTES
    meaning: Exact uninterpreted octet sequence.
    constraints: length is explicit and bounded by enclosing declared region and configured limits; no rewriting follows from retention.
    requirement_refs: [DNS-REQ-010, DNS-REQ-011]
  - id: DOM-TRANSPORT
    meaning: Selected DNS transport.
    constraints: one of UDP or TCP; TCP-first, reuse, and pipelining are not current selection promises.
    requirement_refs: [DNS-REQ-013, DNS-REQ-017, DNS-REQ-019, DNS-REQ-021]
  - id: DOM-PEER-CONTEXT
    meaning: Network endpoint identity used for transaction correlation.
    constraints: selected peer address, local address/port, transport, and deadline are retained for a pending request.
    requirement_refs: [DNS-REQ-004, DNS-REQ-013, DNS-REQ-017]
  - id: DOM-CONSUMPTION
    meaning: Input-consumption outcome.
    constraints: either no consumption with need-more-input, one completed TCP frame consumed, or complete UDP datagram examined; dereferenced compression bytes do not change parent-field consumption.
    requirement_refs: [DNS-REQ-007, DNS-REQ-009, DNS-REQ-019]
entities:
  - id: ENT-QUERY-INTENT
    meaning: Locally requested standard DNS lookup before wire construction.
    attributes: [qname, qtype, qclass_IN, recursion_desired_option, selected_peer, deadline]
    invariants: [one query only, selected ordinary QTYPE only, no invalid name/options cause I/O]
    requirement_refs: [DNS-REQ-001, DNS-REQ-002, DNS-REQ-003, DNS-REQ-005]
  - id: ENT-REQUEST-CONTEXT
    meaning: Pending transaction identity and lifecycle owner.
    attributes: [id, canonical_qname, qtype, qclass, peer_context, transport, deadline, request_state]
    invariants: [ID is unpredictable across full 16-bit domain; removed on every terminal path]
    requirement_refs: [DNS-REQ-004, DNS-REQ-013, DNS-REQ-020, DNS-REQ-022]
  - id: ENT-DNS-HEADER
    meaning: Semantically decoded 12-octet DNS message header.
    attributes: [id, qr, opcode, aa, tc, rd, ra, z, ad, cd, rcode, qdcount, ancount, nscount, arcount]
    invariants: [all fields are available only after complete header; z is zero for accepted profile message]
    requirement_refs: [DNS-REQ-005, DNS-REQ-006, DNS-REQ-015, DNS-REQ-016]
  - id: ENT-QUESTION
    meaning: DNS question tuple.
    attributes: [qname, qtype, qclass]
    invariants: [response acceptance requires exactly one echoed question semantically matching request context]
    requirement_refs: [DNS-REQ-001, DNS-REQ-007, DNS-REQ-012, DNS-REQ-013, DNS-REQ-014]
  - id: ENT-RESOURCE-RECORD
    meaning: Structurally complete DNS RR envelope.
    attributes: [owner_name, type, class, ttl, rdata]
    invariants: [rdata occupies exactly declared RDLENGTH; unknown ordinary type retains exact opaque rdata]
    requirement_refs: [DNS-REQ-007, DNS-REQ-010, DNS-REQ-011]
  - id: ENT-DNS-RESPONSE
    meaning: Fully structural, correlated DNS response candidate.
    attributes: [header, echoed_question, answer_records, authority_records, additional_records, response_metadata]
    invariants: [all sections parse in count order; parsing consumes the complete DNS message; no successful response contains OPT in this profile]
    requirement_refs: [DNS-REQ-007, DNS-REQ-013, DNS-REQ-015, DNS-REQ-025]
  - id: ENT-FRAME-ACCUMULATOR
    meaning: TCP framing state before DNS message parsing.
    attributes: [prefix_bytes_0_to_2, declared_body_length, body_bytes_0_to_declared_length]
    invariants: [prefix is outside DNS message; incomplete state emits no DNS decode; zero declared length is terminal malformed]
    requirement_refs: [DNS-REQ-019]
  - id: ENT-OWNED-RESULT
    meaning: Sole owner of published DNS response metadata, records, names, and raw RDATA.
    attributes: [response, dns_status_classification, ownership_lifetime]
    invariants: [published once at most; all contained views expire together when result is destroyed; no terminal failure transfers partial ownership]
    requirement_refs: [DNS-REQ-010, DNS-REQ-015, DNS-REQ-018, DNS-REQ-022, DNS-REQ-023]
messages:
  - id: MSG-STANDARD-QUERY
    semantic_fields: [id, qr_false, opcode_query, rd_from_local_option, reserved_zero, qdcount_one, zero_response_counts, question]
    constraints: [no compression pointer in emitted qname, qclass is IN, response-only flags absent]
    requirement_refs: [DNS-REQ-001, DNS-REQ-002, DNS-REQ-003, DNS-REQ-005]
  - id: MSG-DNS-MESSAGE
    semantic_fields: [header, question_section, answer_section, authority_section, additional_section]
    constraints: [header precedes ordered sections; all declared content fully present; exact message-end consumption]
    requirement_refs: [DNS-REQ-006, DNS-REQ-007, DNS-REQ-008, DNS-REQ-009, DNS-REQ-010, DNS-REQ-011]
  - id: MSG-TCP-FRAME
    semantic_fields: [body_length, dns_message_octets]
    constraints: [body_length is nonzero U16; prefix is separate from DNS message; one completed frame is emitted per parse step]
    requirement_refs: [DNS-REQ-019, DNS-REQ-020]
peer_roles:
  - id: ROLE-STUB-CLIENT
    meaning: Constructs one standard query, maintains request context, accepts only correlated complete responses, and publishes an atomic owned result.
    requirement_refs: [DNS-REQ-001, DNS-REQ-004, DNS-REQ-013, DNS-REQ-022]
  - id: ROLE-UPSTREAM-RESOLVER
    meaning: Selected DNS peer; response is treated as untrusted transport input, not authenticated data.
    requirement_refs: [DNS-REQ-013, DNS-REQ-017, DNS-REQ-027]
states:
  - id: ST-NEW
    meaning: Query intent received; no wire request/context exists.
    requirement_refs: [DNS-REQ-022]
  - id: ST-BUILT
    meaning: Local validation succeeded, standard query and request context exist, but no transport pending state is active.
    requirement_refs: [DNS-REQ-001, DNS-REQ-002, DNS-REQ-003, DNS-REQ-004, DNS-REQ-005, DNS-REQ-022]
  - id: ST-UDP-PENDING
    meaning: UDP request is outstanding until correlated complete response, timeout/network failure, cancellation, or TC fallback.
    requirement_refs: [DNS-REQ-013, DNS-REQ-017, DNS-REQ-018, DNS-REQ-022]
  - id: ST-TCP-PENDING
    meaning: TCP fallback transaction is outstanding; its frame accumulator may require additional input.
    requirement_refs: [DNS-REQ-018, DNS-REQ-019, DNS-REQ-020, DNS-REQ-022]
  - id: ST-COMPLETE
    meaning: One fully parsed, correlated, supported response has published one owned result.
    requirement_refs: [DNS-REQ-015, DNS-REQ-022]
  - id: ST-FAILED
    meaning: Terminal local, protocol, resource, extension, or transport failure; no result exists.
    requirement_refs: [DNS-REQ-002, DNS-REQ-003, DNS-REQ-016, DNS-REQ-017, DNS-REQ-019, DNS-REQ-023, DNS-REQ-024, DNS-REQ-025]
  - id: ST-CANCELLED
    meaning: Terminal cancellation; no result exists and request resources are released.
    requirement_refs: [DNS-REQ-004, DNS-REQ-022]
events:
  - id: EVT-LOCAL-REQUEST
    meaning: Local request intent is submitted.
    requirement_refs: [DNS-REQ-001, DNS-REQ-002, DNS-REQ-003, DNS-REQ-005]
  - id: EVT-UDP-DATAGRAM
    meaning: One complete UDP datagram arrives with source/destination metadata.
    requirement_refs: [DNS-REQ-013, DNS-REQ-017]
  - id: EVT-TCP-BYTES
    meaning: Zero or more TCP bytes arrive for the selected fallback transaction.
    requirement_refs: [DNS-REQ-019, DNS-REQ-020]
  - id: EVT-DEADLINE-OR-NETWORK-FAILURE
    meaning: Timeout, network, connect, EOF, or transport failure occurs.
    requirement_refs: [DNS-REQ-017, DNS-REQ-019, DNS-REQ-022]
  - id: EVT-CANCEL
    meaning: Local cancellation is requested.
    requirement_refs: [DNS-REQ-022]
transitions:
  - id: TR-VALIDATE-AND-BUILD
    role_state: ST-NEW
    event: EVT-LOCAL-REQUEST
    guard: Query intent has valid DNS name, selected ordinary QTYPE, class IN, supported options, and available dependency.
    effects: [create unpredictable ID, create request context, construct standard query, retain no result]
    next_state: ST-BUILT
    requirement_refs: [DNS-REQ-001, DNS-REQ-002, DNS-REQ-003, DNS-REQ-004, DNS-REQ-005]
  - id: TR-LOCAL-REJECT
    role_state: ST-NEW
    event: EVT-LOCAL-REQUEST
    guard: Any local validation or supported-capability condition fails.
    effects: [emit local_validation_error, send_no_packet, retain_no_context_or_result]
    next_state: ST-FAILED
    requirement_refs: [DNS-REQ-002, DNS-REQ-003, DNS-REQ-024]
  - id: TR-SEND-UDP
    role_state: ST-BUILT
    event: local_transport_start
    guard: UDP-first profile is selected.
    effects: [send_one_complete_dns_message_as_one_udp_datagram]
    next_state: ST-UDP-PENDING
    requirement_refs: [DNS-REQ-017, DNS-REQ-021, DNS-REQ-022]
  - id: TR-IGNORE-NONMATCHING-UDP
    role_state: ST-UDP-PENDING
    event: EVT-UDP-DATAGRAM
    guard: Datagram fails ID/question/peer/local-address-port/transport correlation.
    effects: [ignore_for_this_request, keep_context_and_deadline, publish_nothing]
    next_state: ST-UDP-PENDING
    requirement_refs: [DNS-REQ-012, DNS-REQ-013, DNS-REQ-017, DNS-REQ-023]
  - id: TR-UDP-MALFORMED
    role_state: ST-UDP-PENDING
    event: EVT-UDP-DATAGRAM
    guard: Datagram is correlated but fails accepted header, structural, count, name, RDLENGTH, exact-consumption, or reserved-bit rule.
    effects: [discard_partial_records, release_context_and_buffers, emit_malformed_response]
    next_state: ST-FAILED
    requirement_refs: [DNS-REQ-006, DNS-REQ-007, DNS-REQ-008, DNS-REQ-009, DNS-REQ-010, DNS-REQ-011, DNS-REQ-014, DNS-REQ-016, DNS-REQ-023]
  - id: TR-UDP-TC-FALLBACK
    role_state: ST-UDP-PENDING
    event: EVT-UDP-DATAGRAM
    guard: Datagram is correlated and structurally valid through TC observation, with TC true.
    effects: [discard_udp_partial_content, preserve_query_identity, initialize_tcp_fallback_context]
    next_state: ST-TCP-PENDING
    requirement_refs: [DNS-REQ-018, DNS-REQ-021, DNS-REQ-022]
  - id: TR-UDP-PUBLISH
    role_state: ST-UDP-PENDING
    event: EVT-UDP-DATAGRAM
    guard: Datagram is correlated, structurally complete, TC false, has no OPT, and respects limits.
    effects: [classify_dns_rcode_metadata, atomically_publish_owned_result, release_request_context_and_transport_buffers]
    next_state: ST-COMPLETE
    requirement_refs: [DNS-REQ-007, DNS-REQ-010, DNS-REQ-015, DNS-REQ-022, DNS-REQ-025]
  - id: TR-TCP-NEED-MORE
    role_state: ST-TCP-PENDING
    event: EVT-TCP-BYTES
    guard: Fewer than two prefix bytes or fewer than declared body bytes are available.
    effects: [consume_only_available_frame_bytes, retain_accumulator_and_context, emit_need_more_input, decode_no_dns_message]
    next_state: ST-TCP-PENDING
    requirement_refs: [DNS-REQ-019]
  - id: TR-TCP-INVALID-FRAME
    role_state: ST-TCP-PENDING
    event: EVT-TCP-BYTES
    guard: Complete prefix declares zero length, exceeds configured limit, or EOF interrupts a frame.
    effects: [discard_accumulator, release_context, emit_malformed_response_or_resource_limit_or_transport_error]
    next_state: ST-FAILED
    requirement_refs: [DNS-REQ-019, DNS-REQ-023, DNS-REQ-024]
  - id: TR-TCP-IGNORE-NONMATCHING
    role_state: ST-TCP-PENDING
    event: completed_tcp_frame
    guard: Complete framed message is not correlated to this outstanding request.
    effects: [consume_one_frame, publish_nothing, retain_pending_context]
    next_state: ST-TCP-PENDING
    requirement_refs: [DNS-REQ-013, DNS-REQ-019, DNS-REQ-020]
  - id: TR-TCP-PUBLISH
    role_state: ST-TCP-PENDING
    event: completed_tcp_frame
    guard: Frame is correlated, structurally complete, TC handling accepted by profile, has no OPT, and respects limits.
    effects: [consume_one_frame, classify_dns_rcode_metadata, atomically_publish_owned_result, release_context_and_buffers]
    next_state: ST-COMPLETE
    requirement_refs: [DNS-REQ-015, DNS-REQ-019, DNS-REQ-020, DNS-REQ-022, DNS-REQ-025]
  - id: TR-TERMINAL-ERROR
    role_state: [ST-UDP-PENDING, ST-TCP-PENDING]
    event: EVT-DEADLINE-OR-NETWORK-FAILURE
    guard: Any deadline or local transport failure.
    effects: [release_context_and_buffers, publish_no_result, emit_transport_error]
    next_state: ST-FAILED
    requirement_refs: [DNS-REQ-017, DNS-REQ-018, DNS-REQ-019, DNS-REQ-022]
  - id: TR-CANCEL
    role_state: [ST-BUILT, ST-UDP-PENDING, ST-TCP-PENDING]
    event: EVT-CANCEL
    guard: Request is not terminal.
    effects: [release_context_and_buffers, publish_no_result]
    next_state: ST-CANCELLED
    requirement_refs: [DNS-REQ-004, DNS-REQ-022]
sessions:
  - id: SES-UDP-TRANSACTION
    meaning: One request context plus one complete datagram exchange; datagrams never concatenate.
    requirement_refs: [DNS-REQ-017]
  - id: SES-TCP-FALLBACK-TRANSACTION
    meaning: One request context plus incremental frame accumulator after UDP TC; no connection-reuse/pipelining commitment.
    requirement_refs: [DNS-REQ-018, DNS-REQ-019, DNS-REQ-020, DNS-REQ-021]
streams:
  - id: STR-TCP-DNS-FRAME
    meaning: Ordered byte stream segmented into independent length-prefixed DNS messages.
    constraints: one completed frame at most per parse step; future shared connection multiplexing is deferred.
    requirement_refs: [DNS-REQ-019, DNS-REQ-020, DNS-REQ-021]
timers:
  - id: TIM-REQUEST-DEADLINE
    meaning: Deadline held in request context from build until terminal cleanup.
    constraints: expiration is a local terminal transport outcome, not a DNS response; retry policy is absent.
    requirement_refs: [DNS-REQ-004, DNS-REQ-017, DNS-REQ-022]
errors:
  - id: ERR-LOCAL-VALIDATION
    meaning: Invalid name, unsupported QTYPE/options, or unavailable dependency before I/O.
    terminal: true
    requirement_refs: [DNS-REQ-002, DNS-REQ-003]
  - id: ERR-MALFORMED-RESPONSE
    meaning: Correlated input violates framing, structural, name, count, length, accepted-header, or exact-consumption constraints.
    terminal: true
    requirement_refs: [DNS-REQ-006, DNS-REQ-007, DNS-REQ-008, DNS-REQ-009, DNS-REQ-010, DNS-REQ-011, DNS-REQ-014, DNS-REQ-016, DNS-REQ-019, DNS-REQ-023]
  - id: ERR-RESOURCE-LIMIT
    meaning: Configured preallocation/preiteration budget is exceeded.
    terminal: true
    requirement_refs: [DNS-REQ-024]
  - id: ERR-UNSUPPORTED-EXTENSION
    meaning: Structurally valid OPT/EDNS material is encountered in the excluded profile.
    terminal: true
    requirement_refs: [DNS-REQ-025]
  - id: ERR-TRANSPORT
    meaning: Timeout, network, connect, or EOF event without a valid completed result.
    terminal: true
    requirement_refs: [DNS-REQ-017, DNS-REQ-018, DNS-REQ-019]
  - id: OUT-DNS-STATUS
    meaning: Nonzero base RCODE or negative answer classification on a fully structural correlated response.
    terminal: false
    constraints: response outcome is distinct from parser/transport failure and does not imply cache/retry behavior.
    requirement_refs: [DNS-REQ-015]
resource_invariants:
  - id: INV-BOUNDED-PARSING
    statement: Every cursor, pointer target, label, count, RDLENGTH region, expansion, and iteration is within message and configured resource bounds before read, allocation, indexing, dereference, or copy.
    requirement_refs: [DNS-REQ-007, DNS-REQ-008, DNS-REQ-009, DNS-REQ-010, DNS-REQ-011, DNS-REQ-023, DNS-REQ-024]
  - id: INV-ATOMIC-PUBLICATION
    statement: A request publishes zero or one ENT-OWNED-RESULT only from ST-COMPLETE; every other terminal path discards partial state and transfers no result ownership.
    requirement_refs: [DNS-REQ-018, DNS-REQ-022, DNS-REQ-023, DNS-REQ-025]
  - id: INV-TERMINAL-CLEANUP
    statement: Completion, failure, and cancellation release request context and transport buffers; no correlation context survives terminal state.
    requirement_refs: [DNS-REQ-004, DNS-REQ-017, DNS-REQ-022]
  - id: INV-TRANSACTION-ISOLATION
    statement: A nonmatching or invalid message cannot complete or poison another outstanding request; future pipelined responses require the same correlation semantics.
    requirement_refs: [DNS-REQ-013, DNS-REQ-020]
extension_points:
  - id: EXT-EDNS
    meaning: Future EDNS/OPT, options, payload negotiation, and extended RCODE support.
    current_disposition: excluded; OPT is recognized structurally then rejected as unsupported_extension.
    requirement_refs: [DNS-REQ-025]
  - id: EXT-TYPED-RDATA
    meaning: Future approved typed RDATA interpretations.
    current_disposition: only sourced approved type formats may decode; all other ordinary RR RDATA remains opaque.
    requirement_refs: [DNS-REQ-010, DNS-REQ-011]
  - id: EXT-TRANSPORT-POLICY
    meaning: TCP-first, reuse, pipelining, retry, server selection, encrypted transport, and multiplexing.
    current_disposition: deferred; later scope must define composition framing/state/security and renew affected gates.
    requirement_refs: [DNS-REQ-020, DNS-REQ-021, DNS-REQ-024, DNS-REQ-027]
dependencies:
  - id: DEP-SELECTED-UPSTREAM-RESOLVER
    purpose: DNS peer selected by local configuration or operating system.
    requirement_refs: [DNS-REQ-004, DNS-REQ-013, DNS-REQ-017]
  - id: DEP-OS-NETWORK-STACK
    purpose: Socket transport, endpoint metadata, send/receive, connection, timeout, and EOF events.
    requirement_refs: [DNS-REQ-017, DNS-REQ-019, DNS-REQ-022]
